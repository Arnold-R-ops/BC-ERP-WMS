name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: wms_db_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 123465
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wms_db_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_USERNAME: postgres
      DB_PASSWORD: 123465
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Verify backend
        shell: pwsh
        run: ./src/test/scripts/invoke-ci-verification.ps1 -Mode Run -Component Backend
      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: target/surefire-reports/
          if-no-files-found: warn

  frontend:
    name: Frontend verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Verify frontend
        shell: pwsh
        run: ./src/test/scripts/invoke-ci-verification.ps1 -Mode Run -Component Frontend

  release-gate:
    name: Release gate
    if: always()
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    steps:
      - name: Require all verification jobs
        shell: bash
        run: |
          test "${{ needs.backend.result }}" = "success"
          test "${{ needs.frontend.result }}" = "success"
