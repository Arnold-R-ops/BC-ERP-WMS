# ====================================================================
# WMS config (Spring Boot 3.2.x + Java 17)
# ====================================================================

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: wms-system

  datasource:
    # Please update based on local environment.
    url: jdbc:postgresql://localhost:5432/wms_db?serverTimezone=UTC
    username: postgres
    password: 123465
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: true
      pool-name: WMS-HikariPool
      connection-test-query: SELECT 1

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  flyway:
    baseline-on-migrate: true
    baseline-version: 4.5

  sql:
    init:
      mode: never

  jackson:
    time-zone: UTC
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# ====================================================================
# JWT configuration
# ====================================================================
jwt:
  secret: WW91clN1cGVyU2VjcmV0S2V5Rm9ySldUVG9rZW5HZW5lcmF0aW9uTWluaW11bTI1NkJpdHNCYXNlNjRFbmNvZGVkU3RyaW5nPT0=
  expiration: 86400000
  issuer: WMS-System
  refresh-threshold: 3600000

# ====================================================================
# Batch management configuration
# ====================================================================
batch:
  hashids:
    salt: ${BATCH_SALT:WMS_BATCH_DEFAULT_SALT_2025_FOR_DEVELOPMENT_ONLY}
    min-length: 6

logging:
  level:
    root: INFO
    com.wms: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/wms-system.log
    max-size: 10MB
    max-history: 30
