# ===================================================================
# Test-classpath safety net (applies to ALL Spring context tests,
# including those that do NOT activate the "test" profile).
#
# Background: the main application.yml intentionally has NO defaults
# for DB_PASSWORD / TENANT_JWT_SECRET / PLATFORM_JWT_SECRET / BATCH_SALT
# (fail-fast in production).
