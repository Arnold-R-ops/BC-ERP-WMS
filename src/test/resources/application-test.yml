# ===================================================================
# Spring Boot 测试环境配置
# Profile: test
# 用于单元测试和集成测试
# ===================================================================

spring:
  # 允许 bean 定义覆盖（测试环境需要覆盖 initAdminUser bean）
  main:
    allow-bean-definition-overriding: true

  # 测试环境禁用 Flyway：schema 由下方 ddl-auto: create 从实体全量重建，
  # 测试数据由各测试类 setUp 自播种（不依赖迁移种子）。
  # 不能两套并存——迁移链并非自包含（V2 起就引用 Hibernate 建的 users 表），
  # 在 Hibernate 重建的表上重放增量迁移必然失败（曾致 V4_5_1 报 23502）。
  flyway:
    enabled: false

  # 数据源配置（使用 PostgreSQL 测试数据库）
  # 密码优先读环境变量 DB_PASSWORD，未设置时回落到本地默认值，
  # 这样在数据库改密后无需修改本文件即可继续跑测试
  datasource:
    url: jdbc:postgresql://localhost:5432/wms_db_test?serverTimezone=UTC
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123465}

  # JPA 配置
  jpa:
    database: POSTGRESQL
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create  # 每次测试启动时重建表结构（强制重新创建）
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        # 添加以下属性以确保正确处理已存在的表
        hbm2ddl:
          auto: create
        globally_quoted_identifiers: false
        jdbc:
          lob:
            non_contextual_creation: true

# JWT 配置（测试环境）
jwt:
  # Base64 编码的测试密钥（至少 256 位）
  # 原始字符串: test-jwt-secret-key-for-integration-testing-only-2026
  # Base64 编码后长度足够，满足 HS256 算法要求
  secret: dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItaW50ZWdyYXRpb24tdGVzdGluZy1vbmx5LWRvLW5vdC11c2UtaW4tcHJvZHVjdGlvbi1lbnZpcm9ubWVudC0yMDI2
  expiration: 86400000  # 24 小时（毫秒）
  issuer: WMS-System-Test

# 批次码 Hashids 盐（仅测试用；主配置的 BATCH_SALT 无默认值，测试必须自带）
batch:
  hashids:
    salt: TEST_ONLY_BATCH_SALT_NOT_FOR_PRODUCTION
    min-length: 6

# 日志配置（测试环境）
logging:
  level:
    root: INFO
    com.wms.system: DEBUG
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate: WARN
