# Test-only replacement for application*.yml. No default database URL and no real credentials.
spring.flyway.enabled=false
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
spring.main.banner-mode=off
spring.devtools.restart.enabled=false
spring.test.mockmvc.print=NONE
spring.test.mockmvc.print-only-on-failure=false
wms.platform-bootstrap.enabled=false
wms.legacy-admin-bootstrap-enabled=false
wms.tenancy.require-safe-database-role=true
wms.tenant-security.controls-enabled=false
wms.tenant-security.webhook-worker-enabled=true
# Public synthetic fixtures, not browser/production authentication material.
jwt.tenant-secret=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
jwt.platform-secret=AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
jwt.expiration=86400000
wms.platform-mfa.encryption-key=AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgI=
wms.tenant-security.credential-encryption-key=AwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwM=
batch.hashids.salt=r2-isolated-fixture-only
batch.hashids.min-length=6
logging.level.root=WARN
