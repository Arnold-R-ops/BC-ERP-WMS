# Intentionally replaces application*.yml. The test-only harness adds an immutable
# highest-priority property source before any datasource is constructed.
# No production configuration, password, JWT, MFA key or recovery code belongs here.
spring.flyway.enabled=false
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=validate
spring.main.banner-mode=off
spring.devtools.restart.enabled=false
